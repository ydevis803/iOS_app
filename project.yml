name: FreshTrack
options:
  bundleIdPrefix: com.freshtrack
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_NAME: FreshTrack
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FreshTrack:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    resources:
      - path: Resources
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "FreshTrack needs camera access to scan barcodes and expiration dates on food items."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "FreshTrack syncs expiration dates to your calendar so you never miss them."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "FreshTrack syncs expiration dates to your calendar so you never miss them."
    entitlements:
      com.apple.security.app-sandbox: true
    scheme:
      testTargets: []
