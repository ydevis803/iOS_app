name: FreshTrack
options:
  bundleIdPrefix: com.freshtrack
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FreshTrack:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        # Scoped to the app target only: test bundles must keep their own
        # product/module names so `@testable import FreshTrack` resolves.
        PRODUCT_NAME: FreshTrack
        # Preview assets stay out of release builds, as in Xcode's own template.
        DEVELOPMENT_ASSET_PATHS: '"Resources/Preview Content"'
    sources:
      - path: App
      # XcodeGen has no `resources:` key — bundle resources are `sources` entries
      # with the resources build phase. Without this the asset catalog and fonts
      # are silently left out of the app and every Color.ft* renders as clear.
      - path: Resources
        buildPhase: resources
        excludes:
          - "Fonts/README.md"
    info:
      path: Support/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "FreshTrack needs camera access to scan barcodes and expiration dates on food items."
        NSCalendarsUsageDescription: "FreshTrack syncs expiration dates to your calendar so you never miss them."
        NSCalendarsFullAccessUsageDescription: "FreshTrack syncs expiration dates to your calendar so you never miss them."
        # Custom fonts — files must be added to Resources/Fonts/ (see README there).
        UIAppFonts:
          - Manrope-ExtraBold.ttf
          - Manrope-Bold.ttf
          - Manrope-SemiBold.ttf
          - Inter_18pt-Regular.ttf
          - Inter_18pt-Medium.ttf
          - Inter_18pt-SemiBold.ttf
          - Inter_18pt-Bold.ttf
    scheme:
      testTargets:
        - FreshTrackTests
        - FreshTrackUITests

  FreshTrackTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/FreshTrackTests
    dependencies:
      - target: FreshTrack
    info:
      path: Support/FreshTrackTests-Info.plist
      properties: {}

  FreshTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/FreshTrackUITests
    dependencies:
      - target: FreshTrack
    info:
      path: Support/FreshTrackUITests-Info.plist
      properties: {}
