name: FreshTrack
options:
  bundleIdPrefix: com.freshtrack
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_NAME: FreshTrack
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FreshTrack:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    resources:
      - path: Resources
    info:
      path: Support/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "FreshTrack needs camera access to scan barcodes and expiration dates on food items."
        NSCalendarsUsageDescription: "FreshTrack syncs expiration dates to your calendar so you never miss them."
        NSCalendarsFullAccessUsageDescription: "FreshTrack syncs expiration dates to your calendar so you never miss them."
        # Custom fonts — files must be added to Resources/Fonts/ (see README there).
        UIAppFonts:
          - Manrope-ExtraBold.ttf
          - Manrope-Bold.ttf
          - Manrope-SemiBold.ttf
          - Inter_18pt-Regular.ttf
          - Inter_18pt-Medium.ttf
          - Inter_18pt-SemiBold.ttf
          - Inter_18pt-Bold.ttf
    entitlements:
      path: Support/FreshTrack.entitlements
      properties:
        com.apple.security.app-sandbox: true
    scheme:
      testTargets: []
